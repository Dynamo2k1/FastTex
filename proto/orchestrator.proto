syntax = "proto3";

package fasttex.orchestrator.v1;

// Build Orchestrator Service
// Handles compilation job scheduling and coordination
service OrchestratorService {
    // Submit a compilation request
    rpc Compile(CompileRequest) returns (CompileResponse);
    
    // Get status of a compilation job
    rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);
    
    // Cancel a running compilation
    rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
    
    // Stream compilation progress
    rpc StreamProgress(JobStatusRequest) returns (stream ProgressUpdate);
    
    // Get project dependency graph
    rpc GetDependencyGraph(DependencyGraphRequest) returns (DependencyGraphResponse);
}

// Compile request message
message CompileRequest {
    // Project identifier
    string project_id = 1;
    
    // Main file to compile
    string target_file = 2;
    
    // Compilation mode
    CompileMode mode = 3;
    
    // Force full recompilation
    bool force_rebuild = 4;
    
    // User requesting the compilation
    string user_id = 5;
}

enum CompileMode {
    COMPILE_MODE_UNSPECIFIED = 0;
    // Full compilation from scratch
    COMPILE_MODE_FULL = 1;
    // Incremental compilation (only changed files)
    COMPILE_MODE_INCREMENTAL = 2;
    // Draft mode (faster, lower quality)
    COMPILE_MODE_DRAFT = 3;
}

// Compile response message
message CompileResponse {
    // Job identifier
    string job_id = 1;
    
    // Initial status
    JobStatus status = 2;
    
    // Estimated completion time (milliseconds)
    int64 estimated_duration_ms = 3;
}

// Job status request
message JobStatusRequest {
    string job_id = 1;
}

// Job status response
message JobStatusResponse {
    string job_id = 1;
    JobStatus status = 2;
    float progress = 3;
    string current_task = 4;
    repeated Diagnostic diagnostics = 5;
    string pdf_url = 6;
    int64 duration_ms = 7;
}

enum JobStatus {
    JOB_STATUS_UNSPECIFIED = 0;
    JOB_STATUS_QUEUED = 1;
    JOB_STATUS_COMPILING = 2;
    JOB_STATUS_MERGING = 3;
    JOB_STATUS_COMPLETED = 4;
    JOB_STATUS_FAILED = 5;
    JOB_STATUS_CANCELLED = 6;
}

// Cancel job request
message CancelJobRequest {
    string job_id = 1;
}

// Cancel job response
message CancelJobResponse {
    bool success = 1;
    string message = 2;
}

// Progress update for streaming
message ProgressUpdate {
    string job_id = 1;
    JobStatus status = 2;
    float progress = 3;
    string current_task = 4;
    repeated Diagnostic new_diagnostics = 5;
}

// Compilation diagnostic (error or warning)
message Diagnostic {
    DiagnosticSeverity severity = 1;
    string message = 2;
    string file = 3;
    int32 line = 4;
    int32 column = 5;
}

enum DiagnosticSeverity {
    DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
    DIAGNOSTIC_SEVERITY_ERROR = 1;
    DIAGNOSTIC_SEVERITY_WARNING = 2;
    DIAGNOSTIC_SEVERITY_INFO = 3;
}

// Dependency graph request
message DependencyGraphRequest {
    string project_id = 1;
}

// Dependency graph response
message DependencyGraphResponse {
    repeated GraphNode nodes = 1;
    repeated GraphEdge edges = 2;
    string root_node_id = 3;
}

message GraphNode {
    string id = 1;
    NodeType type = 2;
    string path = 3;
    string content_hash = 4;
    bool needs_recompile = 5;
}

enum NodeType {
    NODE_TYPE_UNSPECIFIED = 0;
    NODE_TYPE_PREAMBLE = 1;
    NODE_TYPE_MAIN_DOCUMENT = 2;
    NODE_TYPE_CHAPTER = 3;
    NODE_TYPE_FIGURE = 4;
    NODE_TYPE_BIBLIOGRAPHY = 5;
}

message GraphEdge {
    string from_node_id = 1;
    string to_node_id = 2;
}
