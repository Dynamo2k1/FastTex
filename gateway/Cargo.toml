[package]
name = "fasttex-gateway"
version = "0.1.0"
edition = "2021"
description = "FastTeX Realtime Gateway - WebSocket server for Yjs sync and compile events"
license = "MIT"

[[bin]]
name = "fasttex-gateway"
path = "src/main.rs"

[lib]
name = "fasttex_gateway"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.35", features = ["full", "process"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.21"
futures = "0.3"
dashmap = "5.5"
bytes = "1.5"
tempfile = "3.9"

[dev-dependencies]
tokio-test = "0.4"
