[package]
name = "fasttex-worker"
version = "0.1.0"
edition = "2021"
description = "FastTeX Worker - Tectonic-based LaTeX compilation worker for Firecracker microVMs"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3.9"
# Note: tectonic crate is optional for now - in production, use the actual crate
# tectonic = "0.15"
# For now, we simulate Tectonic execution

[dev-dependencies]
tokio-test = "0.4"
